- name: Make os var available
  debug:
    var: ansible_os_family

- name: Touch /etc/localtime to trigger time re-read
  file:
    path: /etc/localtime
    state: touch

- name: Re-sync timezone data (safe workaround)
  shell: hwclock --hctosys || true
  become: yes
  ignore_errors: true

- name: Ensure EPEL repo is enabled
  yum:
    name: epel-release
    state: present
    when: ansible_os_family == "RedHat"
- name: Install packages on Debian
  apt:
    name:
      - docker-ce
      - docker.io 
      - docker-ce-cli
      - containerd.io
      - git
      - ntpdate
      - python3-venv
      - python3-pip
      - python3-psycopg2
      - postgresql
      - postgresql-contrib
      - libpq-dev
      - ca-certificates
      - curl
      - tar
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install packages on RedHat
  dnf:
    name:
      - ncurses
      - docker.io 
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - git
      - python3
      - python3-pip
      - postgresql
      - postgresql-server
      - libpq-devel
      - ca-certificates
      - curl
      - tar
      - ansible
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "RedHat"

- name: Ensure Docker is enabled and started
  systemd:
    name: docker
    enabled: yes
    state: started


- name: Create Python virtual environment
  command: python3 -m venv "{{ app_dir }}/venv"
  args:
    creates: "{{ app_dir }}/venv/bin/activate"


- name: Download Node Exporter tarball
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: '0644'

- name: Extract node_exporter binary
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp/
    remote_src: yes

- name: Move binary to /usr/local/bin
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: '0755'
    remote_src: yes

- name: Create systemd service file for node_exporter
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User={{ node_exporter_user }}
      Group={{ node_exporter_user }}
      Type=simple
      ExecStart=/usr/local/bin/node_exporter

      [Install]
      WantedBy=default.target
    mode: '0644'
    force: yes

- name: Reload systemd to read new service file
  systemd:
    daemon_reload: yes

- name: Enable and start node_exporter service
  systemd:
    name: node_exporter
    state: started
    enabled: yes

- name: Clean up tarball and folder
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/node_exporter.tar.gz"
    - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"










