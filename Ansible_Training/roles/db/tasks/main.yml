- name: Ensure PostgreSQL is running and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Ensure Ansible temp directory exists for postgres
  file:
    path: /var/lib/postgresql/.ansible/tmp
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Get installed PostgreSQL version
  shell: psql -V | awk '{print $3}' | cut -d'.' -f1
  register: pg_version
  changed_when: false

- name: Set PostgreSQL to listen on all interfaces
  lineinfile:
    path: /etc/postgresql/{{ pg_version.stdout }}/main/postgresql.conf
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Allow connections from web server
  lineinfile:
    path: /etc/postgresql/{{ pg_version.stdout }}/main/pg_hba.conf
    line: "host    all             all             {{ web_host_ip }}/24            md5"
    insertafter: EOF
  notify: Restart PostgreSQL

