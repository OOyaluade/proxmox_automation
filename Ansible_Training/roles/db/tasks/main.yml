- name: Create PostgreSQL user manually
  shell: |
    sudo -u postgres psql -c "CREATE USER {{ db_user }} WITH ENCRYPTED PASSWORD '{{ db_password }}';"
  become: yes
  changed_when: false
  notify: Restart PostgreSQL

- name: Grant schema and default privileges
  shell: |
    sudo -u postgres psql -d {{ db_name }} -c "GRANT USAGE, CREATE ON SCHEMA public TO {{ db_user }};"
    sudo -u postgres psql -d {{ db_name }} -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ db_user }};"
    sudo -u postgres psql -d {{ db_name }} -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ db_user }};"
  become: yes
  changed_when: false
  notify: Restart PostgreSQL

- name: Grant all privileges on database
  shell: |
    sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_user }};"
  become: yes
  changed_when: false
  notify: Restart PostgreSQL

- name: Validate PostgreSQL connection from created user
  shell: |
    PGPASSWORD='{{ db_password }}' psql -U {{ db_user }} -h localhost -d {{ db_name }} -c '\dt'
  register: pg_validate
  changed_when: false
  ignore_errors: true
